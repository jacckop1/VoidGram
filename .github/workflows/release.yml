# Publishes a GitHub release from an IPA that a finished "Native iOS port" run already built:
# no rebuild. The notes come from docs/releases/v<version>.md; the IPA's size and SHA-256 are
# appended to them, and the release is tagged at the commit that run built.
name: Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the successful "Native iOS port" run whose IPA to publish
        required: true
      version:
        description: VoidGram version, e.g. 27.6.9
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: VoidGram-ios-*
          path: artifact
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          notes="docs/releases/v${VERSION}.md"
          test -f "$notes" || { echo "::error::$notes is missing"; exit 1; }
          ipa=$(find artifact -name '*.ipa' | head -n 1)
          test -n "$ipa" || { echo "::error::run $RUN_ID has no IPA"; exit 1; }
          asset="VoidGram-${VERSION}.ipa"
          cp "$ipa" "$asset"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)
          number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .run_number)
          {
            cat "$notes"
            echo
            echo "---"
            echo
            echo "- IPA: **${asset}**, unsigned, build ${number}, commit \`${sha}\`"
            echo "- Size: $(stat -c %s "$asset") bytes"
            echo "- SHA-256: \`$(sha256sum "$asset" | cut -d' ' -f1)\`"
          } > release-notes.md
          gh release create "v${VERSION}" "$asset" --target "$sha" --title "VoidGram ${VERSION}" --notes-file release-notes.md --latest
