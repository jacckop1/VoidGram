name: VoidGram Desktop (Windows)

# Builds AyuGram Desktop with the patches in desktop/patches for Windows x64 and keeps VoidGram.exe
# in a zip. A cold run builds Qt, ffmpeg, WebRTC and the rest from source, so it takes hours; the
# libraries are cached for the next runs. Run it by hand ("Run workflow"); give a release tag
# (desktop-vX.Y.Z) to attach the zip to that release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the zip to (leave empty to keep it as an artifact only)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 355
    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
    defaults:
      run:
        shell: cmd

    steps:
      - name: Disk space.
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%
          git config --global core.autocrlf false
          git config --global user.email "ci@voidgram.invalid"
          git config --global user.name "VoidGram CI"

      - uses: actions/checkout@v4
        name: This repository (the patches).
        with:
          path: voidgram

      - name: Clone AyuGram Desktop and apply the patches.
        shell: bash
        run: |
          version="$(cat voidgram/desktop/VERSION)"
          git clone --depth 1 --branch "$version" https://github.com/AyuGram/AyuGramDesktop.git "$TBUILD/AyuGramDesktop"
          cd "$TBUILD/AyuGramDesktop"
          # Not recursive: the only nested submodule a build needs is cppgir, which only Linux compiles.
          git submodule update --init --depth=1
          for patch in "$GITHUB_WORKSPACE"/voidgram/desktop/patches/*.patch; do
            git apply --index "$patch"
          done
          echo "REPO_NAME=AyuGramDesktop" >> $GITHUB_ENV

      - name: Fix the MSYS2 package name.
        shell: bash
        run: |
          # MSYS2 no longer has mingw-w64-x86_64-diffutils; the same tool is the plain msys package.
          sed -i 's/mingw-w64-x86_64-diffutils/diffutils/' "$TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py"
          grep -n "diffutils" "$TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py"

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      # The same toolset and ATL steps AyuGram's own Windows build uses.
      - name: Visual Studio ATL component.
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          if (-not (Test-Path $vswhere) -or -not (Test-Path $setup)) {
            throw "Visual Studio Installer is incomplete at $installer."
          }
          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
          if (-not $path) {
            throw "No Visual Studio instance provides $toolsComponent."
          }
          $toolset = Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') -Directory `
            | Where-Object { $_.Name -like '14.44.*' } `
            | Sort-Object Name -Descending `
            | Select-Object -First 1
          if (-not $toolset) {
            throw "The selected Visual Studio instance has no 14.44 toolset."
          }
          $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
          if (Test-Path $header) {
            Write-Host "ATL is already installed for $($toolset.Name)."
            exit 0
          }
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify',
            '--installPath', "`"$path`"",
            '--add', $atlComponent,
            '--quiet', '--norestart', '--nocache'
          )
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Installer exited with $($process.ExitCode)."
          }
          if (-not (Test-Path $header)) {
            throw "$atlComponent completed without installing $header."
          }

      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      # A run that runs out of time still saves what it built, so the next run goes on from there.
      - name: Libraries.
        id: libraries
        timeout-minutes: 300
        continue-on-error: true
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache.
        if: always() && steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save Libraries cache.
        if: always() && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Qt cache.
        if: always() && steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      - name: Stop if the libraries are not finished.
        if: steps.libraries.outcome != 'success'
        shell: bash
        run: |
          echo "::error::The libraries did not finish (time limit or an error). They are cached: run the workflow again to go on."
          exit 1

      # The compile writes tens of GB of objects and PDBs; C: is nearly full out of the box and D: has
      # ~150 GB, so the build tree (out) lives on D:. The libraries stay where they were cached.
      # The compiler's precompiled headers need more memory than the runner's 16 GB: a big pagefile on D:.
      - name: Pagefile.
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 24GB
          maximum-size: 40GB
          disk-root: "D:"

      - name: Build tree on the big disk.
        run: |
          mkdir D:\voidgram-out
          if exist %TBUILD%\%REPO_NAME%\out rmdir /S /Q %TBUILD%\%REPO_NAME%\out
          mklink /d %TBUILD%\%REPO_NAME%\out D:\voidgram-out

      - name: VoidGram build.
        env:
          TDESKTOP_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
          -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --parallel -- /p:CL_MPCount=3

      - name: Disk after the build.
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Pack.
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME/out/Release"
          ls -la
          exe="$(ls VoidGram.exe Telegram.exe 2>/dev/null | head -n 1)"
          test -n "$exe" || { echo "::error::no exe in out/Release"; exit 1; }
          mkdir -p pack/VoidGram
          cp "$exe" pack/VoidGram/VoidGram.exe
          (cd pack && 7z a -mx9 "$GITHUB_WORKSPACE/voidgram-desktop-windows-x64.zip" VoidGram)

      - uses: actions/upload-artifact@v4
        with:
          name: voidgram-desktop-windows-x64
          path: voidgram-desktop-windows-x64.zip
          if-no-files-found: error

      - name: Attach to the release.
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" voidgram-desktop-windows-x64.zip --clobber -R "$GITHUB_REPOSITORY"
