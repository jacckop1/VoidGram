name: VoidGram Desktop (macOS)

on:
  push:
    paths:
      - .github/workflows/desktop-macos.yml
      - desktop/build-macos.sh
      - desktop/ci/package-macos.sh
      - desktop/VERSION
      - desktop/patches/**
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach packages to (empty for artifacts only)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 355
    env:
      WORK_DIR: ${{ github.workspace }}/TBuild
      DIST_DIR: ${{ github.workspace }}/dist
      JOBS: '3'
    steps:
      - uses: actions/checkout@v4

      - name: Check API credentials
        env:
          TDESKTOP_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          test -n "$TDESKTOP_API_ID" && test -n "$TDESKTOP_API_HASH" \
            || { echo "::error::Set TELEGRAM_API_ID and TELEGRAM_API_HASH in repository Actions secrets."; exit 1; }

      - name: Build tools
        run: |
          xcodebuild -version
          brew install automake libtool cmake wget pkg-config gnu-tar ninja nasm meson

      - name: Source and patches
        run: bash desktop/build-macos.sh prepare

      - name: Cache identity
        id: identity
        run: |
          toolchain="$(xcodebuild -version | shasum -a 256 | awk '{print $1}')"
          echo "prefix=macos-${RUNNER_ARCH}-$toolchain-${{ hashFiles('desktop/VERSION', 'desktop/build-macos.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            TBuild/Libraries
            TBuild/ThirdParty
          key: ${{ steps.identity.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.identity.outputs.prefix }}-

      - name: Prepare dependencies
        id: libraries
        timeout-minutes: 285
        continue-on-error: true
        run: bash desktop/build-macos.sh libraries

      - name: Save dependency progress
        if: always() && steps.libraries.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            TBuild/Libraries
            TBuild/ThirdParty
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Require completed dependencies
        if: steps.libraries.outcome != 'success'
        run: |
          echo "::error::Dependencies did not finish. Inspect the library log; if it timed out, rerun to resume cached progress."
          exit 1

      - name: Build universal application
        env:
          TDESKTOP_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: bash desktop/build-macos.sh build

      - name: Archive application before packaging
        run: ditto -c -k --sequesterRsrc --keepParent "$WORK_DIR/src/out/Release/VoidGram.app" voidgram-macos-app.zip

      - name: Keep application before packaging
        uses: actions/upload-artifact@v4
        with:
          name: voidgram-macos-app
          path: voidgram-macos-app.zip
          if-no-files-found: error

      - name: Package and verify
        run: bash desktop/build-macos.sh package

      - uses: actions/upload-artifact@v4
        with:
          name: voidgram-desktop-macos-universal
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voidgram-desktop-macos-universal
          path: dist
      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
